<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HostelFit MVP</title><link rel="stylesheet" href="styles.css"></head><body>
<header><b>Hostel<span>Fit</span></b><nav id="nav" class="hidden"><button data-v="dashboard">Dashboard</button><button data-v="meals">Meals</button><button data-v="workouts">Workouts</button><button data-v="progress">Progress</button><button data-v="profile">Profile</button><button data-v="admin">Admin</button><button id="logout">Logout</button></nav></header>
<main class="wrap"><section id="auth"><div><small>UCS503P · HOSTELFIT MVP</small><h1>Fitness tracking built around your hostel mess.</h1><p>Log meals, workouts, weight and view an approximate daily calorie balance.</p></div><div class="panel"><div class="tabs"><button class="active" data-auth="login">Login</button><button data-auth="register">Register</button></div>
<form id="login"><label>Email<input id="le" type="email" required></label><label>Password<input id="lp" type="password" required></label><button class="primary" type="submit">Login</button></form>
<form id="register" class="hidden"><label>Name<input id="rn" required></label><label>Email<input id="re" type="email" required></label><label>Password<input id="rp" type="password" minlength="6" required></label><button class="primary" type="submit">Create Account</button></form><p id="msg"></p></div></section>
<section id="app" class="hidden"><div class="heading"><div><small>HOSTELFIT</small><h2 id="title">Dashboard</h2></div><span id="date"></span></div><div id="content"></div></section></main><footer>HostelFit MVP · Estimates only · UCS503P</footer><script src="app.js"></script></body></html>
